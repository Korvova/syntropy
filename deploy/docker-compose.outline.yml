# Outline — база знаний с деревом документов (коллекция → документ → вложенные). Домен wiki.syntropy.test-rms.ru (вместо Wiki.js).
# Вход по письму со ссылкой (SMTP в .env) или через OIDC (Битрикс24 через Keycloak — позже).
services:
  outline-db:
    image: postgres:16-alpine
    container_name: syntropy-outline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: outline
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${OUTLINE_DB_PASSWORD}
    volumes:
      - outline-db:/var/lib/postgresql/data

  outline-redis:
    image: redis:7-alpine
    container_name: syntropy-outline-redis
    restart: unless-stopped

  outline-mail:
    # почтовая заглушка: письма со ссылкой на вход ловятся здесь, веб на 127.0.0.1:8026 (пока нет настоящего SMTP)
    image: axllent/mailpit:latest
    container_name: syntropy-outline-mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"

  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: syntropy-outline
    restart: unless-stopped
    depends_on: [outline-db, outline-redis, outline-mail]
    env_file: .env
    environment:
      NODE_ENV: production
      URL: https://wiki.syntropy.test-rms.ru
      PORT: 3000
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD}@outline-db:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: 104857600
      DEFAULT_LANGUAGE: en_US   # русского в Outline нет
      FORCE_HTTPS: "true"
      # вход по письму
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_SECURE: ${SMTP_SECURE}
    volumes:
      - outline-data:/var/lib/outline/data
    ports:
      - "127.0.0.1:3400:3000"

volumes:
  outline-db:
  outline-data:
