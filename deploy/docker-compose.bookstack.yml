# BookStack — база знаний с жёсткими уровнями: полка → книга → страницы (инициатива → эпик → Т. страницы).
# Работает в подпапке /kb основного домена, отдельная DNS-запись не нужна.
services:
  bookstack-db:
    image: mariadb:11
    container_name: syntropy-bookstack-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db:/var/lib/mysql

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: syntropy-bookstack
    restart: unless-stopped
    depends_on: [bookstack-db]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Moscow
      APP_URL: https://syntropy.test-rms.ru/kb
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: bookstack-db
      DB_PORT: 3306
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      DB_DATABASE: bookstack
      APP_LANG: ru
      APP_AUTO_LANG_PUBLIC: "false"
    volumes:
      - bookstack-data:/config
    ports:
      - "127.0.0.1:3300:80"

volumes:
  bookstack-db:
  bookstack-data:
